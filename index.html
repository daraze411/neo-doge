<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1520">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Neo-Doge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: mappa notturna di Genova come tabellone a sinistra, plancia del giocatore a destra; su telefono la plancia si aggancia in basso */
:root{
  --bg:#0a1520; --panel:#0f2030; --panel2:#15293c; --line:#27405a; --fg:#e3ecf4; --muted:#8fa5ba;
  --accent:#7fd6ff; --red:#ef4b4f; --genoa:#c8102e;
  --su:#ff62b0; --li:#46dfa0; --ca:#ffb547;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px calc(var(--dockh,0px) + 20px)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;display:grid;gap:14px}
.below{display:grid;gap:12px;min-width:0}
@media(min-width:900px){.below{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start;gap:18px}}
.col{display:grid;gap:12px;min-width:0;align-content:start}
.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.flag{flex:0 0 auto;width:30px;height:30px;border-radius:3px;background:#f2f4f6;position:relative;overflow:hidden}
.flag::before,.flag::after{content:"";position:absolute;background:#d6252b}
.flag::before{left:12px;top:0;width:6px;height:100%}.flag::after{top:12px;left:0;height:6px;width:100%}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,42px);letter-spacing:.05em;margin:0;line-height:.95;text-transform:uppercase}
.brand p{margin:2px 0 0;color:var(--muted);font-family:var(--cond);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.btn{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;padding:9px 14px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:#04121c;border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.4;cursor:default}
.main{display:grid;gap:12px;min-width:0}
.status{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.eyebrow{font-family:var(--cond);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.status .big{font-family:var(--cond);font-weight:600;font-size:19px;line-height:1.2;text-wrap:balance}
.status .big.alarm{color:var(--red)}
.ticker{font-size:14px;color:var(--fg);min-height:1.45em}
.mapwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cb{fill:rgba(9,18,28,.92);stroke:#4a6987;stroke-width:6}
.cbt{font-family:var(--mono);font-size:44px;fill:var(--fg);text-anchor:middle}
.mk.lead0 .cb{stroke:var(--su);stroke-width:9}.mk.lead1 .cb{stroke:var(--li);stroke-width:9}.mk.lead2 .cb{stroke:var(--ca);stroke-width:9}
.mk.tie .cb{stroke:var(--red);stroke-width:9;stroke-dasharray:14 8}
.mk.next .cb{fill:var(--red)}
.mk.sel .cb{stroke:var(--accent);stroke-width:11}.mk.chosen .cb{stroke:#fff;stroke-width:11}
.cring{fill:none;stroke:var(--red);stroke-width:6;transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite}
#map.compact .pm-t{font-size:40px}#map.compact .pm-c{font-size:32px}#map.compact .sea{font-size:40px}
#mapc,#mapp{display:block;width:100%;max-width:620px;height:auto;margin:0 auto}
#mapp .mb{stroke-width:1.5}#mapp .mk.lead0 .mb,#mapp .mk.lead1 .mb,#mapp .mk.lead2 .mb,#mapp .mk.tie .mb{stroke-width:2.2}#mapp .mk.tie .mb{stroke-dasharray:5 3}
#mapp .mk.sel .mb,#mapp .mk.chosen .mb{stroke-width:2.8}
#mapp .nn{font-size:12px}#mapp .cnt{font-size:12.5px}#mapp .home{font-size:7.5px}#mapp .ct{font-size:9.5px}
#mapp .badge circle{stroke-width:1.2}#mapp .badge text{font-size:10px}#mapp .badge .ring{stroke-width:2}#mapp .nego{stroke-width:1.5}
#mapp .pm-s{stroke-width:1.5}#mapp .link{stroke-width:1.8;stroke-dasharray:1.5 5}
.zb{fill:#142739}
.zo{fill:none;stroke:#9cc3e0;stroke-width:1.6;stroke-linejoin:round;pointer-events:none}
.qls text{font-family:var(--cond);font-size:8.5px;letter-spacing:.06em;fill:#56758f}
.seac{font-family:var(--cond);font-size:12px;letter-spacing:.45em;fill:#4d7d9c}
.pmc-t{font-family:var(--cond);font-weight:700;font-size:11px;letter-spacing:.14em;fill:var(--muted)}
.pmc-c{font-family:var(--cond);font-size:9px;letter-spacing:.12em;fill:var(--muted)}
#mapc .mb{stroke-width:1.5}#mapc .mk.lead0 .mb,#mapc .mk.lead1 .mb,#mapc .mk.lead2 .mb,#mapc .mk.tie .mb{stroke-width:2.2}#mapc .mk.tie .mb{stroke-dasharray:5 3}
#mapc .mk.sel .mb,#mapc .mk.chosen .mb{stroke-width:2.8}
#mapc .nn{font-size:12px}#mapc .cnt{font-size:12.5px}#mapc .home{font-size:7.5px}#mapc .ct{font-size:9.5px}
#mapc .badge circle{stroke-width:1.2}#mapc .badge text{font-size:10px}#mapc .badge .ring{stroke-width:2}#mapc .nego{stroke-width:1.5}
#mapc .pm-s{stroke-width:1.5}
#mapc .mb{fill:rgba(8,16,26,.72)}
.ib{fill:#12263b}
.io{fill:none;stroke:rgba(156,195,224,.55);stroke-width:1.4;pointer-events:none}
.isl.lead0 .io,.isl.ctrl0 .io{stroke:var(--su)}.isl.lead1 .io,.isl.ctrl1 .io{stroke:var(--li)}.isl.lead2 .io,.isl.ctrl2 .io{stroke:var(--ca)}
.isl.tie .io,.isl.unrest .io{stroke:var(--red);stroke-dasharray:4 3}
.isl.sel .io{stroke:var(--accent);stroke-width:2.6}.isl.chosen .io{stroke:#fff;stroke-width:2.6}
.isl.dim{opacity:.45}
.thread{stroke:rgba(190,220,245,.38);stroke-width:1.4;stroke-dasharray:2 6;stroke-linecap:round}
.star{fill:#dfe9f5}
.star.tw{animation:tw 3.5s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.beamrot{transform-box:view-box;transform-origin:205px 366px;animation:sweep 9s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.star.tw,.beamrot{animation:none!important}.beamrot{transform:rotate(200deg)}}
#mapc .link{stroke-width:1.8;stroke-dasharray:1.5 5}
#map{display:block;width:100%;height:auto}
.link{stroke:rgba(156,195,224,.5);stroke-width:3;stroke-dasharray:2 10;stroke-linecap:round}
.zx{fill:transparent}
.zone.sel .zx{fill:var(--accent);fill-opacity:.34;animation:zpulse 1.3s ease-in-out infinite}
.zone.dim .zx{fill:#050b11;fill-opacity:.55}
.zone.chosen .zx{fill:#fff;fill-opacity:.32;animation:none}
.zone.flash .zx{animation:zflash 1.5s ease-out}
@keyframes zpulse{50%{fill-opacity:.1}}
@keyframes zflash{0%{fill:#7fd6ff;fill-opacity:.6}100%{fill:#7fd6ff;fill-opacity:0}}
.mk.sel{cursor:pointer}
.mb{fill:rgba(9,18,28,.9);stroke:#4a6987;stroke-width:2}
.mk.lead0 .mb{stroke:var(--su);stroke-width:3.5}.mk.lead1 .mb{stroke:var(--li);stroke-width:3.5}.mk.lead2 .mb{stroke:var(--ca);stroke-width:3.5}
.mk.tie .mb{stroke:var(--red);stroke-width:3.5;stroke-dasharray:8 5}
.mk.ctrl0 .mb{stroke:var(--su)}.mk.ctrl1 .mb{stroke:var(--li)}.mk.ctrl2 .mb{stroke:var(--ca)}.mk.unrest .mb{stroke:var(--red)}
.mk.sel .mb{stroke:var(--accent);stroke-width:4.5}
.mk.chosen .mb{stroke:#fff;stroke-width:4.5}
.mk.dim{opacity:.5}
.nn{font-family:var(--cond);font-weight:600;font-size:17.5px;fill:var(--fg)}
.cnt{font-family:var(--mono);font-size:19px;fill:var(--fg)}.cnt.z{fill:var(--muted);opacity:.45}
.home{font-family:var(--cond);font-size:12.5px;letter-spacing:.12em;fill:#a9bccd}
.ct{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.06em;fill:var(--fg)}
.badge circle{fill:var(--bg);stroke:var(--muted);stroke-width:2}
.badge text{font-family:var(--mono);font-size:16px;fill:var(--fg);text-anchor:middle}
.badge.next circle.c{fill:var(--red);stroke:var(--red)}
.badge .ring{fill:none;stroke:var(--red);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.1);opacity:0}}
.nego{fill:#fff;stroke:var(--bg);stroke-width:2.5}
.sea{font-family:var(--cond);font-size:22px;letter-spacing:.45em;fill:#4d7d9c}
.pm-t{font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.14em;fill:var(--muted)}
.pm-c{font-family:var(--cond);font-size:15px;letter-spacing:.12em;fill:var(--muted)}
.pm-s{fill:var(--bg);stroke:#7a3a3e;stroke-width:2.5}.pm-s.on{fill:var(--red);stroke:var(--red)}
.beam{animation:beam 3.2s ease-in-out infinite}
@keyframes beam{0%,100%{opacity:.35}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.beam,.badge .ring,.cring,.zone .zx{animation:none!important}}
.cal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media(min-width:600px){.cal{grid-template-columns:repeat(8,minmax(0,1fr))}}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 6px;display:grid;gap:1px;min-width:0;text-align:left}
.slot .sn{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.slot .sr{font-family:var(--cond);font-weight:600;font-size:13.5px;line-height:1.1;overflow-wrap:anywhere}
.slot .st{font-size:11.5px;color:var(--muted);display:flex;gap:4px;align-items:center;min-height:16px}
.slot.lead0{border-color:var(--su)}.slot.lead1{border-color:var(--li)}.slot.lead2{border-color:var(--ca)}.slot.tie{border-color:var(--red);border-style:dashed}
.slot .sc{display:flex;gap:5px;font-family:var(--mono);font-size:12px;letter-spacing:-.02em}
@media(max-width:380px){.slot .sc{gap:3px;font-size:11px}}
.slot .sc span{display:inline-flex;align-items:center;gap:2px}.slot .sc .z{opacity:.4}
.slot .hbase{font-family:var(--cond);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.slot.next{box-shadow:inset 0 3px 0 var(--red)}.slot.next .st{color:var(--red);font-weight:600}
.slot.done{opacity:.6}
.slot.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);cursor:pointer}
.slot.dim{opacity:.35}
.disc{width:10px;height:10px;border-radius:50%;background:#fff;display:inline-block}
.sh{display:inline-block;vertical-align:-1px;flex:0 0 auto}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-shadow:0 -10px 28px rgba(0,0,0,.45);max-height:62vh;overflow-y:auto}
.dockin{max-width:1180px;margin:0 auto;display:grid;gap:10px}
.prow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.prompt{font-size:15px;min-width:0}
.prompt b{font-weight:600}
.prompt .ctext{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.prow .acts{display:flex;gap:6px;flex:0 0 auto}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--accent);font-family:var(--cond);font-weight:600;font-size:15px}
.hand{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
@media(min-width:900px){.tile{flex-basis:150px}}
.tile{flex:0 0 128px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 9px;display:grid;gap:3px;align-content:start}
.tile:hover:not([disabled]){border-color:var(--accent)}
.tile[disabled]{opacity:.45;cursor:default}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);opacity:1}
.tile .ti{display:flex;gap:3px;align-items:center;height:14px;font-family:var(--mono);font-size:12px;color:var(--accent)}
.tile .tn{font-family:var(--cond);font-weight:600;font-size:15.5px;line-height:1.1}
.tile .td{font-size:12px;color:var(--muted);line-height:1.3}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.players{display:grid;gap:8px}
.pl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 10px;border-radius:8px;background:var(--panel2);border:1px solid transparent}
.pl.cur{border-color:var(--accent)}
.pl .pn{font-family:var(--cond);font-weight:600;font-size:16px}
.pl .pc{display:flex;gap:10px;font-family:var(--mono);font-size:14px;align-items:center;justify-self:end}
.pl .pc span{display:inline-flex;align-items:center;gap:4px}
.pl .pm{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.tag{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted);vertical-align:2px}
.supply{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:14px}
.supply span{display:inline-flex;gap:4px;align-items:center}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
summary{font-family:var(--cond);font-weight:600;font-size:16px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.log{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:13.5px;max-height:280px;overflow-y:auto}
.log li{border-left:2px solid var(--line);padding-left:8px}
.rules{font-size:14px;max-width:65ch}
.rules h3{font-family:var(--cond);font-size:16px;letter-spacing:.05em;text-transform:uppercase;margin:14px 0 4px}
.rules p,.rules li{margin:4px 0}
.rules ul{padding-left:18px;margin:4px 0}
.fx{font-weight:600;white-space:nowrap}
.fx.f0{color:var(--su)}.fx.f1{color:var(--li)}.fx.f2{color:var(--ca)}
.modal{position:fixed;inset:0;background:rgba(4,10,16,.82);display:grid;place-items:center;z-index:50;overflow-y:auto;
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;padding:22px;display:grid;gap:14px}
.dlg h2{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:.04em;text-transform:uppercase;margin:0;line-height:1;text-wrap:balance}
.dlg p{margin:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.res{width:100%;border-collapse:collapse;font-size:14px}
.res th,.res td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.res td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.res th.n{text-align:right}
.res tr.win td{color:var(--accent);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
[hidden]{display:none!important}
/* Home: stessa notte del gioco, la bandiera di Genova come stemma */
.modal.home{background:var(--bg);color:var(--fg);place-items:start center}
.modal.home .leaves{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.hm{position:relative;z-index:1;width:100%;max-width:560px;margin:0 auto;display:grid;gap:14px;font-size:15.5px}
.hm p{margin:0}
.flagban{position:relative;height:clamp(150px,34vw,200px);background:#f2f4f6;border-radius:6px;overflow:hidden;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line),0 18px 40px rgba(0,0,0,.45)}
.flagban::before{content:"";position:absolute;left:0;right:0;top:50%;height:30%;transform:translateY(-50%);background:var(--genoa)}
.flagban .fv{position:absolute;top:0;bottom:0;left:50%;width:clamp(44px,13vw,62px);transform:translateX(-50%);background:var(--genoa)}
.flagban .fh{position:relative;margin:0;font-family:var(--display);font-weight:800;font-size:clamp(40px,12vw,64px);letter-spacing:.06em;line-height:1;text-transform:uppercase;color:#fff;text-shadow:0 2px 0 rgba(90,0,10,.3)}
.hm-tag{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center}
.hm-mut{color:var(--muted)}
.hm-sec{display:grid;gap:8px}
.hm-lab{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hm-seg,.hm-row{display:flex;gap:6px;flex-wrap:wrap}
.hm-seg.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.hm-seg.three .hb{padding-inline:6px}
.hb{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;padding:9px 14px;border-radius:8px;background:var(--panel2);color:var(--fg);border:1px solid var(--line);cursor:pointer}
.hb:hover{border-color:var(--muted)}
.hb[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.hb.pri{background:var(--accent);border-color:var(--accent);color:#04121c;padding-inline:22px}
.hb.ghost{background:transparent;border-color:transparent;text-decoration:underline}
.hb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.prev{margin:0;display:grid;gap:6px}
.prev img{display:block;width:100%;max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:#0d1a26}
.prev figcaption{font-size:13.5px;color:var(--muted)}
.hm-in{font:inherit;font-size:16px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);width:100%}
.hm-in:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.menuitem{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.jt{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.hm-h{font-family:var(--cond);font-weight:700;font-size:30px;letter-spacing:.06em;text-transform:uppercase;margin:0;text-align:center}
.hm-seg.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.hm-seg.two .hb{padding-inline:6px}
.mpcode{font-family:var(--cond);font-weight:700;font-size:44px;letter-spacing:.3em;text-align:center;color:var(--accent);padding-left:.3em}
.hm-st{color:var(--muted);text-align:center;margin:0}.hm-st.ok{color:var(--li)}
a.hb{text-decoration:none;display:inline-block;text-align:center}
.hm-menu{display:grid;gap:8px}.hm-menu .hb.ghost{justify-self:center}
.menuitem.pri{background:var(--accent);border-color:var(--accent);color:#04121c}.menuitem.pri .ar{color:#04121c}
.hm-foot{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;line-height:1.5;margin-top:6px;padding-bottom:12px}
.menuitem:hover{border-color:var(--muted)}
.menuitem .mt{font-family:var(--cond);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.menuitem .ms{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.menuitem .ar{font-family:var(--mono);color:var(--accent)}
/* Le tue partite */
.st-sec{display:grid;gap:10px;margin-top:18px}
.st-sec h3{margin:0}
.medals{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.medals li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);opacity:.55}
.medals li.on{opacity:1;border-color:#8a7232;background:linear-gradient(180deg,rgba(231,184,74,.12),rgba(231,184,74,.03))}
.medals li>span{display:grid;min-width:0}.medals b{font-family:var(--cond);font-size:16px;font-weight:600}.medals li>span>span{font-size:13px;color:var(--muted)}
.mdi{width:30px;height:36px;flex:0 0 auto}
.newmed{display:grid;gap:8px}
.tbl{overflow-x:auto;flex-shrink:0}
.stt{width:100%;border-collapse:collapse;font-size:14.5px;min-width:320px}
.stt th,.stt td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.stt th{font-family:var(--cond);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stt .n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stt th.n{font-family:var(--cond)}
.stt tr.tot td{font-weight:600;background:var(--panel2);border-bottom:0}
.stt tr.tot td:first-child{border-radius:8px 0 0 8px}.stt tr.tot td:last-child{border-radius:0 8px 8px 0}
.stt td.w{color:var(--accent)}.stt td.l{color:var(--red)}
.just{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.codebox{width:100%;font-family:var(--mono);font-size:12.5px;line-height:1.4;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);resize:vertical;min-height:72px;word-break:break-all}
.msg{font-size:13.5px;min-height:1.3em;margin:0}
.msg.ok{color:var(--li)}.msg.err{color:var(--red)}
.confirm{border:1px solid var(--red);border-radius:10px;padding:12px;display:grid;gap:10px;background:rgba(239,75,79,.08)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.dangerfill{background:var(--red);border-color:var(--red);color:#fff}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.flyer{filter:drop-shadow(0 0 4px rgba(255,255,255,.75))}
.quote{font-family:var(--display);font-weight:800;font-size:clamp(26px,7.5vw,38px);line-height:1.02;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;margin:0}
.quote.q0{color:var(--su)}.quote.q1{color:var(--li)}.quote.q2{color:var(--ca)}
.quote.qi{color:var(--red);font-size:clamp(22px,6vw,30px);text-transform:none;letter-spacing:0;line-height:1.12}
.pop{position:fixed;z-index:40;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(460px,calc(100vw - 32px));
  background:var(--panel2);border:1px solid var(--accent);border-radius:12px;padding:12px 14px 0;box-shadow:0 14px 40px rgba(0,0,0,.6);cursor:pointer;display:grid;gap:4px;overflow:hidden;animation:popin .22s ease-out}
.pop .ph{display:flex;justify-content:space-between;gap:8px;font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.pop .pq{color:var(--muted);font-family:var(--mono);font-weight:500;letter-spacing:0}
.pop .pb{font-size:16px;line-height:1.4;padding-bottom:10px}
.pop .pbar{height:3px;margin:0 -14px;background:var(--line)}
.pop .pbar i{display:block;height:100%;background:var(--accent);transform-origin:left;animation:popbar linear forwards}
.pop.k-pass{border-color:var(--line)}.pop.k-pass .ph{color:var(--muted)}
.pop.k-res{border-color:#fff}.pop.k-res .ph{color:#fff}
.pop.k-unrest{border-color:var(--red)}.pop.k-unrest .ph,.pop.k-unrest .pbar i{color:var(--red);background:var(--red)}
.pop.k-unrest .ph{background:none}
@keyframes popin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes popbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}}
.top{flex-wrap:wrap}
.topacts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media(max-width:520px){.topacts .btn{padding:7px 10px;font-size:14px}.rec{padding:5px 7px;font-size:12px}}
.rec{font-family:var(--mono);font-size:13px;padding:6px 9px;border-radius:8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.rec b{color:var(--fg);font-weight:500}
.modal{place-items:start center}
.dlg{margin:auto}
.dlg.wide{max-width:700px;padding:0;gap:0}
.dlghead{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px 12px;background:var(--panel);border-bottom:1px solid var(--line);border-radius:14px 14px 0 0}
.dlgbody{padding:4px 20px 20px;font-size:15px}
.dlgbody section{max-width:65ch;scroll-margin-top:72px}
.dlgbody h3{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.04em;text-transform:uppercase;margin:22px 0 6px}
.dlgbody h4{font-family:var(--cond);font-size:17px;letter-spacing:.04em;margin:12px 0 2px}
.dlgbody p,.dlgbody li{margin:6px 0}
.dlgbody ul{padding-left:20px;margin:6px 0}
.toc{display:flex;flex-wrap:wrap;gap:6px;padding-top:12px}
.toc a{font-family:var(--cond);font-weight:600;font-size:14px;color:var(--accent);text-decoration:none;padding:4px 9px;border:1px solid var(--line);border-radius:999px}
.toc a:hover{border-color:var(--accent)}
.cards dt{font-family:var(--cond);font-weight:700;font-size:17px;margin-top:12px}
.cards dd{margin:2px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--panel2);border-radius:8px;padding:8px 10px;display:grid}
.stat b{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--cond);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat.w b{color:var(--accent)}.stat.l b{color:var(--red)}
.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:13px}
.muted{color:var(--muted)}
</style>

  <section id="r-scopo"><h3>Scopo del gioco</h3>
    <p>Genova, 2147. Il Neo-Doge è morto e tre fazioni si contendono gli otto quartieri della città: i <span class="fx f0">Sudamericani</span>, i <span class="fx f1">Nativi Liguri</span> e i <span class="fx f2">Camalli</span>. Nessuna è abbastanza forte da prendersi il trono da sola.</p>
    <p>Tu non comandi una fazione. Muovi i seguaci sulla mappa per decidere chi vince ogni quartiere, e intanto raccogli seguaci nella tua corte. A fine partita la fazione più potente sceglie come Neo-Doge chi, nella sua corte, ha più seguaci di quella fazione.</p>
    <p>Il dilemma è tutto qui: ogni seguace che porti in corte rafforza il tuo legame con una fazione, ma la indebolisce sulla mappa.</p>
  </section>
  <section id="r-prep"><h3>Preparazione</h3>
    <ul>
      <li>Ogni fazione ha 18 seguaci (16 se giocate in due).</li>
      <li>Ogni fazione parte con 2 seguaci nella sua base: Sampierdarena per i Sudamericani, Marassi per i Liguri, Centro Storico per i Camalli.</li>
      <li>Ogni giocatore riceve 2 seguaci a caso nella propria corte.</li>
      <li>Ogni quartiere viene riempito a caso fino ad avere 4 seguaci. Gli avanzi formano la riserva.</li>
      <li>Gli otto quartieri vengono messi in ordine casuale nel calendario delle rese dei conti, da 1 a 8.</li>
      <li>Ogni giocatore ha le stesse 8 carte: tre Appoggi (uno per fazione), due Adunate, Trattativa, Manovra e Contromanovra.</li>
    </ul>
  </section>
  <section id="r-turno"><h3>Il turno</h3>
    <p>A turno, ogni giocatore fa una di queste due cose:</p>
    <ul>
      <li><b>Gioca una carta</b> e ne applica l'effetto. Subito dopo deve <b>reclutare</b> un seguace: lo prende da un quartiere qualsiasi della mappa, anche uno non toccato dalla carta, e lo mette nella propria corte. Non si recluta mai dalla riserva.</li>
      <li><b>Passa.</b> Al giro successivo potrà di nuovo giocare o passare.</li>
    </ul>
    <p>Ogni carta si usa una volta sola: hai al massimo otto mosse per tutta la partita. Chi non ha più carte passa sempre.</p>
    <p>Se una carta non si può applicare del tutto, la applichi per quanto possibile. Puoi giocarla anche se non ha alcun effetto: recluti comunque un seguace.</p>
  </section>
  <section id="r-resa"><h3>Le rese dei conti</h3>
    <p>Quando tutti i giocatori passano uno dopo l'altro, si risolve la resa dei conti nel quartiere col numero più basso ancora aperto del calendario.</p>
    <ul>
      <li>La fazione con più seguaci in quel quartiere ne prende il <b>controllo</b>.</li>
      <li>In caso di pareggio, o se il quartiere è vuoto, scoppiano i <b>disordini</b>: il Piemonte avanza di un passo.</li>
      <li>In entrambi i casi tutti i seguaci del quartiere tornano nella riserva.</li>
    </ul>
    <p>Un quartiere deciso resta così fino alla fine: nessuna carta può più metterci o spostarci seguaci. Poi il gioco riprende dal giocatore successivo.</p>
  </section>
  <section id="r-carte"><h3>Le carte</h3>
    <dl class="cards">
      <dt>Appoggio Sudamericano · Ligure · Camallo</dt>
      <dd>Prendi 2 seguaci di quella fazione dalla riserva e mettili insieme in un quartiere libero che confina con un quartiere controllato da quella fazione. Finché la base della fazione non è stata decisa, puoi usare anche un quartiere confinante con la base. Se in riserva ce n'è uno solo, ne metti uno.</dd>
      <dt>Adunata (×2)</dt>
      <dd>Prendi dalla riserva un Sudamericano, un Ligure e un Camallo e mettili nei quartieri liberi che vuoi, insieme o separati. Se una fazione non ha seguaci in riserva, metti solo gli altri.</dd>
      <dt>Trattativa</dt>
      <dd>Scambia di posto nel calendario due quartieri ancora aperti e senza gettone. Metti il gettone di trattativa (il disco bianco) su uno dei due: da quel momento non si potrà più spostare.</dd>
      <dt>Manovra</dt>
      <dd>Scambia un seguace di un quartiere con un seguace di un altro quartiere qualsiasi. Puoi scambiare anche due seguaci della stessa fazione: non cambia nulla, ma recluti comunque.</dd>
      <dt>Contromanovra</dt>
      <dd>Scambia un seguace di un quartiere con due seguaci di un quartiere confinante. Se non è possibile da nessuna parte, scambi uno con uno tra quartieri confinanti.</dd>
    </dl>
    <p class="muted">Non puoi annullare subito la Manovra o la Contromanovra appena giocata da un avversario, cioè rimettere al loro posto gli stessi seguaci. Diventa possibile dopo che qualcuno ha giocato un'altra carta.</p>
  </section>
  <section id="r-fine"><h3>Fine della partita</h3>
    <h4>Invasione dei Piemontesi</h4>
    <p>Al terzo disordine la partita finisce subito. Vince chi ha più <b>terne complete</b> in corte (una terna è un seguace per fazione). A parità vince chi ha giocato una carta per ultimo.</p>
    <h4>Elezione del Neo-Doge</h4>
    <p>Se si risolvono tutte e otto le rese dei conti, le fazioni si classificano per potere: conta il numero di quartieri controllati, e a parità è più potente chi ha vinto una resa dei conti per ultimo.</p>
    <p>Vince chi ha in corte più seguaci della fazione più potente. A parità conta la seconda fazione; se c'è ancora parità, vince chi ha finito le carte per primo.</p>
  </section>
  <section id="r-mappa"><h3>Leggere la mappa</h3>
    <ul>
      <li>La città è divisa in otto zone, separate dai confini chiari. Ogni zona prende il nome del suo quartiere principale e ne raggruppa altri:
        <ul class="zones"><li><b>Sestri Ponente</b>: Voltri, Pra', Pegli, Sestri Ponente</li><li><b>Sampierdarena</b>: Sampierdarena, Cornigliano, Borzoli</li><li><b>Valpolcevera</b>: Rivarolo, Bolzaneto, Pontedecimo</li><li><b>Centro Storico</b>: parte ovest del Centro, verso il porto</li><li><b>Portoria</b>: parte est del Centro</li><li><b>Marassi</b>: Marassi, Staglieno, Molassana, Struppa</li><li><b>Foce</b>: Foce, San Fruttuoso, Albaro</li><li><b>Nervi</b>: San Martino, Apparizione, Bavari, Quarto, Quinto, Nervi, Sant'Ilario</li></ul></li>
      <li>Tocca una zona, la sua etichetta o la sua casella nel calendario per sceglierla.</li>
      <li>Dalla schermata iniziale scegli tra tre mappe: <b>realistica</b>, <b>compressa</b> e <b>onirica</b>. Zone e confini sono gli stessi in tutte e tre. Nella realistica, su schermi stretti, ogni zona mostra solo il suo numero nel calendario: i seguaci li trovi nelle caselle del calendario. Nell'onirica i confini sono fili di luce tra le isole.</li>
      <li>I numeri nell'etichetta sono i seguaci di ogni fazione presenti nella zona.</li>
      <li>Il <b>colore della zona</b> e il bordo dell'etichetta indicano chi vincerebbe la resa dei conti in quel momento. Il <b>tratteggio rosso</b> indica un pareggio. Una zona decisa si colora pieno.</li>
      <li>Il <b>numero nel cerchio</b> è la posizione nel calendario. Quello rosso che pulsa è la prossima resa dei conti.</li>
      <li>Il <b>disco bianco</b> è il gettone di trattativa: quel quartiere non si sposta più nel calendario.</li>
      <li>In alto a sinistra, i tre cerchi del Piemonte contano i disordini.</li>
      <li>Le linee punteggiate collegano le zone confinanti, che contano per gli Appoggi e la Contromanovra.</li>
    </ul>
  </section>
  <section id="r-diff"><h3>Avversari e difficoltà</h3>
    <p>Puoi giocare contro BacicciaBot, contro Sciâ Rina, contro uno dei due scelto a caso, oppure contro entrambi. La difficoltà cambia quanto bene ragiona il computer: a Facile sbaglia spesso, a Normale gioca bene ma non sempre la mossa migliore, a Spietata calcola ogni mossa.</p>
    <p>Nella pagina <b>Le tue partite</b> trovi le statistiche, le medaglie da sbloccare e il codice per salvare i progressi.</p>
  </section>
  <section id="r-consigli"><h3>Consigli</h3>
    <ul>
      <li>Non legarti a una sola fazione: se perde, perdi anche tu.</li>
      <li>Passare è una mossa. Se la prossima resa dei conti ti va bene, passa e conserva le carte.</li>
      <li>Reclutare toglie un seguace dalla mappa: usalo per spostare una maggioranza a tuo favore.</li>
      <li>Con due disordini in tavola, pensa anche alle terne: l'invasione può arrivare da un momento all'altro.</li>
    </ul>
    <p class="muted">Ambientazione originale. Meccaniche basate su un gioco da tavolo di Peer Sylvester.</p>
  </section>

const NB=R.map(()=>[]);EDGES.forEach(([a,b])=>{NB[a].push(b);NB[b].push(a)});

  sup0:{t:'sup',f:0,name:'Appoggio Sudamericano',d:'+2 Sudamericani vicino ai loro quartieri'},
  sup1:{t:'sup',f:1,name:'Appoggio Ligure',d:'+2 Liguri vicino ai loro quartieri'},

// ---------- Utility ----------
const sum=a=>a[0]+a[1]+a[2];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const sig=x=>1/(1+Math.exp(-x));
function cmp(a,b){for(let i=0;i<a.length;i++)if(a[i]!==b[i])return a[i]-b[i];return 0}

// ---------- Regole ----------
const free=(B,r)=>B.ctrl[r]===null;
function cloneB(B){return{f:B.f.map(a=>a.slice()),ctrl:B.ctrl.slice(),sup:B.sup.slice(),order:B.order.map(o=>({...o})),court:B.court.map(a=>a.slice()),instab:B.instab,lastWin:B.lastWin.slice(),sn:B.sn}}
function isUndo(last,p,t,m){
  if(!last||last.t!==t||last.pl===p)return false;
  if(t==='man')return(m.a===last.a&&m.fa===last.fb&&m.b===last.b&&m.fb===last.fa)||(m.a===last.b&&m.fa===last.fa&&m.b===last.a&&m.fb===last.fb);
  if(t==='con')return m.a===last.b&&m.fa===last.fa&&m.b===last.a&&String(m.pr)===String(last.pr);
  return false;
}
function genMoves(B,cid,p,last){
  const c=CARD[cid],out=[];
  if(c.t==='sup'){
    const f=c.f,n=Math.min(2,B.sup[f]);if(!n)return out;
    const homeFree=B.ctrl[HOME[f]]===null;
    for(let r=0;r<8;r++){if(!free(B,r))continue;
      if(NB[r].some(q=>B.ctrl[q]===f)||(homeFree&&NB[r].includes(HOME[f])))out.push({r,f,n});}
    return out;
  }
  if(c.t==='adu'){
    const fr=[0,1,2,3,4,5,6,7].filter(r=>free(B,r));
    if(!fr.length||!sum(B.sup))return out;
    const o=[0,1,2].map(f=>B.sup[f]>0?fr:[null]);
    for(const a0 of o[0])for(const a1 of o[1])for(const a2 of o[2])out.push({a0,a1,a2});
    return out;
  }
  if(c.t==='tra'){
    const el=B.order.filter(o=>o.up&&!o.nego).map(o=>o.r);
    if(el.length<2)return out;
    for(const r1 of el)for(const r2 of el)if(r1!==r2)for(const disc of [r1,r2])out.push({r1,r2,disc});
    return out;
  }
  if(c.t==='man'){
    const src=[];for(let r=0;r<8;r++)if(free(B,r))for(let f=0;f<3;f++)if(B.f[r][f]>0)src.push([r,f]);
    for(const[a,fa]of src)for(const[b,fb]of src)if(a!==b){const m={a,fa,b,fb};if(!isUndo(last,p,'man',m))out.push(m)}
    return out;
  }
  if(c.t==='con'){
    const full=[],part=[];
    for(let a=0;a<8;a++){if(!free(B,a))continue;
      for(let fa=0;fa<3;fa++){if(!B.f[a][fa])continue;
        for(const b of NB[a]){if(!free(B,b))continue;const cb=B.f[b];
          for(let g1=0;g1<3;g1++)for(let g2=g1;g2<3;g2++){
            if(g1===g2?cb[g1]>=2:(cb[g1]>=1&&cb[g2]>=1)){const m={a,fa,b,pr:[g1,g2]};if(!isUndo(last,p,'con',m))full.push(m)}}
          for(let g=0;g<3;g++)if(cb[g]>=1){const m={a,fa,b,pr:[g]};if(!isUndo(last,p,'con',m))part.push(m)}
        }}}
    return full.length?full:part;
  }
  return out;
}
function applyMove(B,cid,m){
  if(!m)return;const t=CARD[cid].t;
  if(t==='sup'){B.f[m.r][m.f]+=m.n;B.sup[m.f]-=m.n}
  else if(t==='adu'){[m.a0,m.a1,m.a2].forEach((r,f)=>{if(r!==null){B.f[r][f]++;B.sup[f]--}})}
  else if(t==='tra'){const i=B.order.findIndex(o=>o.r===m.r1),j=B.order.findIndex(o=>o.r===m.r2);
    [B.order[i],B.order[j]]=[B.order[j],B.order[i]];B.order.find(o=>o.r===m.disc).nego=true}
  else if(t==='man'){B.f[m.a][m.fa]--;B.f[m.b][m.fa]++;B.f[m.b][m.fb]--;B.f[m.a][m.fb]++}
  else if(t==='con'){B.f[m.a][m.fa]--;B.f[m.b][m.fa]++;m.pr.forEach(g=>{B.f[m.b][g]--;B.f[m.a][g]++})}
}
function genSummons(B){const o=[];for(let r=0;r<8;r++)for(let f=0;f<3;f++)if(B.f[r][f]>0)o.push({r,f});return o}
function applySummon(B,p,s){B.f[s.r][s.f]--;B.court[p][s.f]++}
function resolveStruggle(B){
  const o=B.order.find(o=>o.up);if(!o)return null;
  const r=o.r,c=B.f[r],mx=Math.max(...c),ws=[0,1,2].filter(f=>c[f]===mx);B.sn++;
  let res;if(mx>0&&ws.length===1){res=ws[0];B.ctrl[r]=res;B.lastWin[res]=B.sn}else{res=-1;B.ctrl[r]=-1;B.instab++}
  const counts=c.slice();for(let f=0;f<3;f++)B.sup[f]+=c[f];B.f[r]=[0,0,0];o.up=false;o.res=res;
  return{r,res,counts};
}
function endState(B){if(B.instab>=3)return'inv';if(B.order.every(o=>!o.up))return'cor';return null}
const regCount=(B,f)=>B.ctrl.filter(c=>c===f).length;
function powerRank(B){return[0,1,2].sort((x,y)=>regCount(B,y)-regCount(B,x)||B.lastWin[y]-B.lastWin[x])}

// ---------- IA ----------
function evalB(B,p){
  const me=B.court[p],others=B.court.filter((_,i)=>i!==p);
  const end=endState(B);
  const mySets=Math.min(...me),oppSets=Math.max(...others.map(c=>Math.min(...c)));
  if(end==='inv')return mySets>oppSets?1:mySets<oppSets?0:.5;
  if(end==='cor'){const rk=powerRank(B);const k=c=>[c[rk[0]],c[rk[1]]];
    let best=1;for(const o of others){const d=cmp(k(me),k(o));if(d<0)return 0;if(d===0)best=.5}return best}
  const opp=[0,1,2].map(f=>Math.max(...others.map(c=>c[f])));
  const P=[0,0,0];B.ctrl.forEach(c=>{if(c!==null&&c>=0)P[c]++});
  let tieE=B.instab,k=0;
  for(const o of B.order){if(!o.up)continue;
    const w=Math.max(.35,.92-.09*k),c=B.f[o.r],s=[...c].sort((a,b)=>b-a);
    if(s[0]===0||s[0]===s[1])tieE+=k===0?.8:.22;
    else P[c.indexOf(s[0])]+=w*(s[0]-s[1]>=2?1:.72);
    k++}
  let lw=0;for(let f=1;f<3;f++)if(B.lastWin[f]>B.lastWin[lw])lw=f;if(B.lastWin[lw]>0)P[lw]+=.2;
  const ex=P.map(x=>Math.exp(1.3*x)),se=ex[0]+ex[1]+ex[2];
  const g=[0,1,2].map(f=>sig(1.4*(me[f]-opp[f])));
  let Vc=0;for(let f=0;f<3;f++)Vc+=ex[f]/se*(.82*g[f]+.18*(g[(f+1)%3]+g[(f+2)%3])/2);
  const Vi=sig(1.6*(mySets-oppSets));
  const pInv=sig(2.2*(tieE-2.6));
  return(1-pInv)*Vc+pInv*Vi;
}
const DIFS=[{id:'facile',name:'Facile',d:'Il computer sbaglia spesso e a volte gioca a caso.'},
  {id:'normale',name:'Normale',d:'Gioca bene, ma non sempre la mossa migliore.'},
  {id:'spietata',name:'Spietata',d:'Calcola ogni mossa e sceglie sempre la migliore.'}];
const DIF_T={facile:.08,normale:.05,spietata:0},DIF_RANDOM={facile:.3,normale:.1,spietata:0};
function aiDecide(G,p,level){
  level=level||G.dif||'spietata';
  const B=G.B,n=G.players.length,hand=G.players[p].hand,T=DIF_T[level]||0;
  const noise=()=>(Math.random()-.5)*.012;
  let passB=B;if(G.passes===n-1){passB=cloneB(B);resolveStruggle(passB)}
  let best={type:'pass',v:evalB(passB,p)+noise()};
  if(!hand.length)return best;
  const cands=T>0?[best]:null;
  const remaining=B.order.filter(o=>o.up).length;
  const cost=.04*Math.min(2,Math.max(.3,remaining/hand.length));
  for(const cid of new Set(hand)){
    let moves=genMoves(B,cid,p,G.last);if(!moves.length)moves=[null];
    for(const m of moves){
      const B2=cloneB(B);applyMove(B2,cid,m);const ss=genSummons(B2);
      if(!ss.length){const v=evalB(B2,p)-cost+noise(),c={type:'play',cid,m,s:null,v};if(cands)cands.push(c);if(v>best.v)best=c;continue}
      for(const s of ss){applySummon(B2,p,s);const v=evalB(B2,p)-cost+noise(),c={type:'play',cid,m,s,v};
        if(cands)cands.push(c);if(v>best.v)best=c;B2.f[s.r][s.f]++;B2.court[p][s.f]--}
    }
  }
  if(!cands)return best;
  if(Math.random()<(DIF_RANDOM[level]||0)){
    // mossa a caso: prima sceglie la carta (o il passo), poi una sua variante
    const keys=[...new Set(cands.map(c=>c.type==='pass'?'pass':c.cid))],k=keys[Math.floor(Math.random()*keys.length)];
    const pool=cands.filter(c=>(c.type==='pass'?'pass':c.cid)===k);return pool[Math.floor(Math.random()*pool.length)];
  }
  let tot=0;const w=cands.map(c=>{const x=Math.exp((c.v-best.v)/T);tot+=x;return x});
  let r=Math.random()*tot;for(let i=0;i<cands.length;i++){r-=w[i];if(r<=0)return cands[i]}
  return best;
}

let G=null,ME=0,MP=null;

function newGame(nAI,mp){
  if(!mp){nAI=nAI||OPT.ai;ME=0;mpClose()}
  const n=mp?2+nAI:nAI+1,per=n===2?16:18,pool=[];
  for(let f=0;f<3;f++)for(let i=0;i<per-2;i++)pool.push(f);
  shuffle(pool);
  const B={f:R.map(()=>[0,0,0]),ctrl:R.map(()=>null),sup:[0,0,0],order:[],court:[],instab:0,lastWin:[0,0,0],sn:0};
  HOME.forEach((r,f)=>B.f[r][f]+=2);
  for(let p=0;p<n;p++){B.court.push([0,0,0]);for(let k=0;k<2;k++)B.court[p][pool.pop()]++}
  for(let r=0;r<8;r++)while(sum(B.f[r])<4)B.f[r][pool.pop()]++;
  pool.forEach(f=>B.sup[f]++);
  B.order=shuffle([0,1,2,3,4,5,6,7]).map(r=>({r,up:true,nego:false,res:null}));
  let foes=AI_NAMES.slice();
  if(mp){foes=nAI?[mp.ai==='rina'?'Sciâ Rina':'BacicciaBot']:[]}
  else if(nAI===1){const pick=OPT.opp==='casuale'?(Math.random()<.5?'baciccia':'rina'):OPT.opp;foes=[pick==='rina'?'Sciâ Rina':'BacicciaBot']}
  const humans=mp?[{name:esc(mp.names[0])||'Tu',ai:false},{name:esc(mp.names[1])||'Amico',ai:false}]:[{name:esc(OPT.name)||'Tu',ai:false}];
  if(mp&&humans[0].name===humans[1].name)humans[1].name+=' 2';
  const players=[...humans,...foes.map(name=>({name:esc(name),ai:true}))]
    .map(pl=>({...pl,hand:START.slice(),played:[],emptiedAt:null,lastPlayAt:0}));
  G={B,players,dif:mp&&mp.dif||OPT.dif,cur:Math.floor(Math.random()*n),passes:0,last:null,actionNo:0,log:[],over:null,flash:null,gid:Math.random().toString(36).slice(2,8),evn:0,ev:[]};
  if(mp)G.mp=true;
  UI={phase:'idle'};
  resetPop();addLog(`La partita comincia. ${T(G.cur,'Inizi <b>tu</b>.','Inizia <b>$n</b>.')}`,'start','Nuova partita');
}

function blobPath(cx,cy,rx,ry,seed){
  let t=seed*9301+49297;const rnd=()=>{t=(t*9301+49297)%233280;return t/233280};
  const n=9,pts=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,k=.86+rnd()*.24;pts.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}
  let d='';for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n],m=[(p[0]+q[0])/2,(p[1]+q[1])/2];
    if(i===0){const z=pts[n-1];d+=`M${((z[0]+p[0])/2).toFixed(1)} ${((z[1]+p[1])/2).toFixed(1)} `}
    d+=`Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${m[0].toFixed(1)} ${m[1].toFixed(1)} `}
  return d+'Z';
}

function regPt(r,f){if(COMPACT){const h=HOME.includes(r)?CHH:CH;return{x:CMARK[r][0]-CW/2+7+f*27+5,y:CMARK[r][1]-h/2+20+5}}const h=HOME.includes(r)?MHH:MH;return{x:MARK[r][0]-MW/2+10+f*42+7.5,y:MARK[r][1]-h/2+29+7.5}}
const courtPt=p=>COMPACT?(p===ME?{x:210,y:570}:{x:210,y:-30}):(p===ME?{x:726,y:730}:{x:726,y:-40});
function flightsFor(cid,m){
  if(!m)return[];const t=CARD[cid].t,o=[];
  if(t==='sup')for(let i=0;i<m.n;i++)o.push({f:m.f,from:SUP_PT,to:regPt(m.r,m.f)});
  else if(t==='adu')[m.a0,m.a1,m.a2].forEach((r,f)=>{if(r!==null)o.push({f,from:SUP_PT,to:regPt(r,f)})});
  else if(t==='man'){o.push({f:m.fa,from:regPt(m.a,m.fa),to:regPt(m.b,m.fa)},{f:m.fb,from:regPt(m.b,m.fb),to:regPt(m.a,m.fb)})}
  else if(t==='con'){o.push({f:m.fa,from:regPt(m.a,m.fa),to:regPt(m.b,m.fa)});m.pr.forEach(g=>o.push({f:g,from:regPt(m.b,g),to:regPt(m.a,g)}))}
  return o;
}

function runFly(){
  if(!pendingFly)return;const list=pendingFly;pendingFly=null;
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
  const layer=document.getElementById(COMPACT?'flyc':'fly');
  list.forEach((t,i)=>{
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','flyer');
    const sz=COMPACT?11:13;g.innerHTML=svgShape(t.f,-sz/2,-sz/2,sz);layer.appendChild(g);
    const a=t.from,b=t.to,mx=(a.x+b.x)/2,my=Math.min(a.y,b.y)-50;
    if(!g.animate){g.remove();return}
    const an=g.animate([
      {transform:`translate(${a.x}px,${a.y}px) scale(1)`,opacity:1},
      {transform:`translate(${mx}px,${my}px) scale(1.7)`,opacity:1,offset:.5},
      {transform:`translate(${b.x}px,${b.y}px) scale(${t.fade?.6:1})`,opacity:t.fade?0:1}],
      {duration:900,delay:i*120,easing:'ease-in-out',fill:'both'});
    an.onfinish=()=>g.remove();
  });
}

    G.passes=0;const nr=G.B.order.find(o=>o.up).r;queueFly([0,1,2].flatMap(f=>Array.from({length:G.B.f[nr][f]},()=>({f,from:regPt(nr,f),to:SUP_PT,fade:true}))));
    const res=resolveStruggle(G.B);
    const cnt=[0,1,2].map(f=>`${shp(f)}${res.counts[f]}`).join(' ');
    addLog(res.res>=0
      ?`Resa dei conti a ${rn(res.r)}: vincono i ${fx(res.res,1)} (${cnt}).`
      :`Resa dei conti a ${rn(res.r)}: ${sum(res.counts)?'pareggio':'quartiere vuoto'}, scoppiano i disordini. Il Piemonte avanza (${G.B.instab}/3).`,
      res.res>=0?'res':'unrest','Tutti hanno passato: resa dei conti');
    G.flash={ids:[res.r],t:Date.now()};
    if(endState(G.B)){G.over=finalResult();G.over.quote=INV_QUOTES[Math.floor(Math.random()*INV_QUOTES.length)];recordResult();UI={phase:'idle'};render();whenIdle(showEnd,200);return}
  }
  endTurn();
}
function endTurn(){G.cur=(G.cur+1)%G.players.length;UI={phase:'idle'};render();schedule()}
function finalResult(){
  const B=G.B,n=G.players.length,kind=endState(B),idx=[...Array(n).keys()];
  let key;
  if(kind==='cor'){const rk=powerRank(B);key=p=>[B.court[p][rk[0]],B.court[p][rk[1]],-(G.players[p].emptiedAt??1e9)];
    idx.sort((a,b)=>cmp(key(b),key(a)));}
  else{key=p=>[Math.min(...B.court[p]),G.players[p].lastPlayAt];idx.sort((a,b)=>cmp(key(b),key(a)))}
  const top=key(idx[0]),winners=idx.filter(p=>cmp(key(p),top)===0);
  let by=0;if(n>1){const a=key(idx[0]),b=key(idx[1]);by=a.findIndex((v,i)=>v!==b[i]);if(by<0)by=a.length}
  return{kind,rank:kind==='cor'?powerRank(B):null,order:idx,winners,by};
}

// ---------- Turni automatici ----------
let timer=null;
let turnSeq=0;
function schedule(){
  if(!G||G.over)return;
  const seq=++turnSeq,p=G.cur,pl=G.players[p];
  if(pl.ai)whenIdle(()=>aiTurn(seq),450);
  else if(!pl.hand.length)whenIdle(()=>{if(seq===turnSeq&&!G.over&&G.cur===p)doPass(p,T(p,': non hai più carte',': non ha più carte'))},600);
}
function aiTurn(seq){
  if(seq!==turnSeq||!G||G.over)return;const p=G.cur;if(!G.players[p].ai)return;
  const d=aiDecide(G,p);
  if(d.type==='pass'){doPass(p);return}
  playAction(p,d.cid,d.m);render();
  whenIdle(()=>{
    if(seq!==turnSeq)return;
    if(d.s)doSummon(p,d.s);else addLog('Nessun seguace da reclutare.','info',who(p));
    endTurn();
  },250);
}

const FIELDS={
  sup:()=>[{k:'r',kind:'region',q:m=>`Dove arrivano ${m.n===1?'un '+fx(m.f):'due '+fx(m.f,1)}?`}],
  adu:moves=>[0,1,2].filter(f=>moves.some(m=>m['a'+f]!==null)).map(f=>({k:'a'+f,kind:'region',q:()=>`Dove va il ${fx(f)}?`})),
  tra:()=>[{k:'r1',kind:'region',q:()=>'Scegli il primo quartiere da spostare nel calendario.'},
    {k:'r2',kind:'region',q:(m,pk)=>`Con quale quartiere scambi ${rn(pk.r1)}?`},
    {k:'disc',kind:'choice',q:()=>'Su quale metti il gettone? Da lì non si sposterà più.'}],
  man:()=>[{k:'a',kind:'region',q:()=>'Da quale quartiere parte il primo seguace?'},
    {k:'fa',kind:'faction',q:(m,pk)=>`Quale seguace sposti da ${rn(pk.a)}?`},
    {k:'b',kind:'region',q:(m,pk)=>`Con quale quartiere scambi il ${fx(pk.fa)}?`},
    {k:'fb',kind:'faction',q:(m,pk)=>`Quale seguace di ${rn(pk.b)} va a ${rn(pk.a)}?`}],
  con:()=>[{k:'a',kind:'region',q:()=>'Scegli il quartiere che cede un seguace.'},
    {k:'fa',kind:'faction',q:(m,pk)=>`Quale seguace cede ${rn(pk.a)}?`},
    {k:'b',kind:'region',q:m=>`Scegli un quartiere confinante che ne cede ${m.pr.length===2?'due':'uno'}.`},
    {k:'pr',kind:'pair',q:(m,pk)=>`Quali seguaci arrivano a ${rn(pk.a)}?`}]};
const FIELDS_SUMMON=[{k:'r',kind:'region',q:()=>'<b>Recluta:</b> tocca il quartiere da cui prendi un seguace.'},
  {k:'f',kind:'faction',q:(m,pk)=>`Quale seguace di ${rn(pk.r)} entra nella tua corte?`}];
const REGION_KEYS=['r','a','b','r1','r2','a0','a1','a2'];
function distinctVals(k){const seen=new Map();UI.moves.forEach(m=>{const s=String(m[k]);if(!seen.has(s))seen.set(s,m[k])});return[...seen.values()]}
const curField=()=>UI.fields&&UI.fields[UI.step];
function pickVal(v){const fd=curField();UI.picks[fd.k]=v;UI.moves=UI.moves.filter(m=>String(m[fd.k])===String(v));UI.step++}
function advance(){
  while(UI.step<UI.fields.length){const fd=curField();const vals=distinctVals(fd.k);
    if(fd.kind!=='region'&&vals.length===1){pickVal(vals[0]);continue}break}
  if(UI.step>=UI.fields.length)finishPick();
}
function finishPick(){
  const m=UI.moves[0];
  if(UI.phase==='pick'){const cid=UI.cid;UI={phase:'idle'};humanPlay(cid,m)}
  else if(UI.phase==='summon'){UI={phase:'idle'};humanSummon(m)}
}
const MPG=()=>!!(MP&&MP.role==='guest'&&G&&G.mp);
function humanPlay(cid,m){
  if(MPG()){mpSend({t:'act',cid,m});UI={phase:'wait'};render();return}
  playAction(ME,cid,m);startSummon();
}
function humanSummon(s){
  if(MPG()){mpSend({t:'sum',s});UI={phase:'wait'};render();return}
  doSummon(ME,s);endTurn();
}
function startSummon(){
  const ss=genSummons(G.B);
  if(!ss.length){if(MPG()){mpSend({t:'sum',s:null});UI={phase:'wait'};render();return}addLog('Nessun seguace da reclutare.','info',who(ME));endTurn();return}
  UI={phase:'summon',all:ss,moves:ss,fields:FIELDS_SUMMON,step:0,picks:{}};advance();
}
function myTurn(){return G&&!G.over&&G.cur===ME}
function beginCard(i){
  if(!myTurn()||UI.phase!=='idle')return;
  const cid=G.players[ME].hand[i],moves=genMoves(G.B,cid,ME,G.last);
  if(!moves.length){UI={phase:'noeffect',cid,hi:i};render();return}
  UI={phase:'pick',cid,hi:i,all:moves,moves,fields:FIELDS[CARD[cid].t](moves),step:0,picks:{}};
  advance();render();
}
function onRegion(r){
  const fd=curField();if(!fd||fd.kind!=='region')return;
  if(!distinctVals(fd.k).includes(r))return;
  pickVal(r);advance();render();
}
function selRegions(){if(UI.phase!=='pick'&&UI.phase!=='summon')return null;const fd=curField();
  if(!fd||fd.kind!=='region')return null;return distinctVals(fd.k)}
function chosenRegions(){if(!UI.picks)return[];return REGION_KEYS.filter(k=>k in UI.picks&&UI.fields.some(f=>f.k===k&&f.kind==='region')).map(k=>UI.picks[k])}
function optLabel(fd,v){
  if(fd.kind==='faction')return shp(v,14)+' '+F[v].one;
  if(fd.kind==='pair')return v.map(g=>shp(g,14)).join('')+' '+v.map(g=>F[g].one).join(' + ');
  return R[v].name;
}

  return`<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="1" fill="${c}"/>`}

function zoneState(B,r){

function addDif(s){const t=blankRec();[1,2].forEach(n=>{t.w+=s.opp[n].w;t.l+=s.opp[n].l;t.p+=s.opp[n].p});s.dif={facile:blankRec(),normale:blankRec(),spietata:t};return s}

function getStats(){
  if(STATS)return STATS;

  if(!validStats(s)){
    let v2=null;try{v2=JSON.parse(localStorage.getItem('neodoge.stats.v2')||'null')}catch(e){}
    if(v2&&v2.opp&&v2.end&&okRec(v2.opp[1])&&okRec(v2.opp[2])&&okRec(v2.end.cor)&&okRec(v2.end.inv)&&okN(v2.streak)&&okN(v2.best)){
      s=addDif({opp:v2.opp,end:v2.end,streak:v2.streak,best:v2.best});try{localStorage.setItem(ST_KEY,JSON.stringify(s))}catch(e){}return STATS=s}
    s=blankStats();
    // migrazione dal formato precedente (neodoge.stats): {all,opp:{1:{w,l,s}},streak,best}
    try{const o=JSON.parse(localStorage.getItem('neodoge.stats')||'null');
      if(o&&o.opp){[1,2].forEach(n=>{const r=o.opp[n];if(r){s.opp[n]={w:r.w|0,l:r.l|0,p:r.s|0}}});s.streak=o.streak|0;s.best=o.best|0;addDif(s);
        try{localStorage.setItem(ST_KEY,JSON.stringify(s))}catch(e){}}}catch(e){}
  }
  return STATS=s;
}
function saveStats(){try{localStorage.setItem(ST_KEY,JSON.stringify(STATS))}catch(e){}}
const okN=v=>Number.isInteger(v)&&v>=0&&v<CODE_MAX;
const okRec=r=>r&&okN(r.w)&&okN(r.l)&&okN(r.p);
function validStats(s){return!!(s&&s.opp&&s.end&&s.dif&&okRec(s.opp[1])&&okRec(s.opp[2])&&okRec(s.end.cor)&&okRec(s.end.inv)&&okRec(s.dif.facile)&&okRec(s.dif.normale)&&okRec(s.dif.spietata)&&okN(s.streak)&&okN(s.best))}
function totals(){const o=getStats().opp,t=blankRec();[1,2].forEach(n=>{t.w+=o[n].w;t.l+=o[n].l;t.p+=o[n].p});return t}
function recordResult(){
  if(!G||!G.over||G.recorded||G.mp)return;G.recorded=true;
  const s=getStats(),w=G.over.winners,k=w.includes(0)?(w.length>1?'p':'w'):'l',n=G.players.length-1;
  s.opp[n][k]++;s.end[G.over.kind][k]++;
  s.dif[G.dif||'spietata'][k]++;
  s.streak=k==='w'?s.streak+1:0;s.best=Math.max(s.best,s.streak);

}

function getMedals(){if(MEDS)return MEDS;let m=null;try{m=JSON.parse(localStorage.getItem(MED_KEY)||'null')}catch(e){}

function checkMedals(k){
  const o=G.over,me=G.players[0],t=totals(),got=getMedals(),fresh=[];
  const win=k==='w',cor=o.kind==='cor',top=cor?o.rank[0]:-1;

    noadunata:win&&!me.played.includes('adu'),asso:win&&me.hand.length>=2,pace:win&&cor&&G.B.instab===0,

// codice di salvataggio
function makeCode(){
  const json=JSON.stringify({v:2,s:getStats(),m:getMedals(),o:{map:MAPMODE,ai:OPT.ai,opp:OPT.opp,dif:OPT.dif,name:OPT.name}});
  return CODE_PRE+btoa(unescape(encodeURIComponent(json))).replace(/=+$/,'');
}
function readCode(raw){
  const c=String(raw||'').replace(/\s+/g,'');if(!c.startsWith(CODE_PRE))return null;
  let b=c.slice(CODE_PRE.length);if(!/^[A-Za-z0-9+/]+$/.test(b))return null;while(b.length%4)b+='=';
  let d;try{d=JSON.parse(decodeURIComponent(escape(atob(b))))}catch(e){return null}
  if(!d||(d.v!==1&&d.v!==2))return null;
  if(d.v===1&&d.s&&!d.s.dif&&d.s.opp&&okRec(d.s.opp[1])&&okRec(d.s.opp[2]))addDif(d.s);
  if(!validStats(d.s))return null;
  let meds=[];if(d.v===2){if(!Array.isArray(d.m)||d.m.length>MEDALS.length||d.m.some(id=>!MEDALS.some(x=>x.id===id)))return null;meds=[...new Set(d.m)]}
  const s=blankStats();[1,2].forEach(n=>s.opp[n]={w:d.s.opp[n].w,l:d.s.opp[n].l,p:d.s.opp[n].p});
  ['cor','inv'].forEach(k=>s.end[k]={w:d.s.end[k].w,l:d.s.end[k].l,p:d.s.end[k].p});s.streak=d.s.streak;s.best=d.s.best;
  ['facile','normale','spietata'].forEach(k=>s.dif[k]={w:d.s.dif[k].w,l:d.s.dif[k].l,p:d.s.dif[k].p});
  const o={},q=d.o||{};if(MAPMODES.some(x=>x.id===q.map))o.map=q.map;if(q.ai===1||q.ai===2)o.ai=q.ai;
  if(OPPS.some(x=>x.id===q.opp))o.opp=q.opp;if(DIFS.some(x=>x.id===q.dif))o.dif=q.dif;if(typeof q.name==='string')o.name=cleanName(q.name);
  return{s,o,m:meds,hasM:d.v===2};
}

function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<5;i++)c+=A[Math.floor(Math.random()*A.length)];return c}
function mpClose(){if(!MP)return;const q=MP;MP=null;ME=0;try{q.conn&&q.conn.close()}catch(e){}try{q.peer&&q.peer.destroy()}catch(e){}}

function mpHost(){
  mpClose();MP={role:'host',code:genCode(),ready:false,friend:null,ai:0,dif:OPT.dif,err:null};ME=0;showMP();
  loadPeer(()=>{

      peer.on('open',()=>{if(MP===q){q.ready=true;showMP()}});

      peer.on('connection',c=>{

function mpJoin(raw,name){
  let code=String(raw||'').toUpperCase().replace(/NEODOGE-/,'').replace(/[^A-Z0-9]/g,'');
  if(!/^[A-Z0-9]{4,8}$/.test(code))return false;
  const nm=cleanName(name)||'Amico';
  mpClose();MP={role:'guest',code,ready:false,hostName:null,err:null,connecting:true,name:nm};ME=1;showMP();
  const q=MP;
  loadPeer(()=>{
    const peer=new window.Peer(undefined,{debug:0});q.peer=peer;
    const to=setTimeout(()=>{if(MP===q&&!q.hostName)mpFail('La stanza non risponde. Controlla il codice e che l’amico sia ancora online.')},15000);
    peer.on('open',()=>{
      const c=peer.connect('neodoge-'+q.code,{reliable:true,serialization:'json'});q.conn=c;
      c.on('open',()=>{if(MP===q)mpSend({t:'hello',name:q.name})});
      c.on('data',d=>mpOnMsg(d,c));c.on('close',()=>{clearTimeout(to);mpGone(c)});c.on('error',()=>{});
    });
    peer.on('error',e=>{clearTimeout(to);if(MP!==q)return;mpFail(e&&e.type==='peer-unavailable'?'Stanza non trovata. Controlla il codice: potrebbe essere stata chiusa.':'Non riesco a collegarmi. Controlla la connessione e riprova.')});
  },()=>mpFail('Non riesco a caricare il servizio di collegamento. Puoi giocare contro il computer.'));
  return true;
}
function mpGone(c){

function mpOnMsg(d,c){
  if(!MP||MP.conn!==c||!d||typeof d!=='object')return;
  if(MP.role==='guest'){
    if(d.t==='welcome'){MP.hostName=String(d.host||'').slice(0,20)||'Amico';MP.connecting=false;MP.err=null;if(!(G&&G.mp&&!G.over))showMP()}
    else if(d.t==='state'&&typeof d.s==='string'){try{mpApply(JSON.parse(d.s))}catch(e){}}
    return;
  }
  if(d.t==='hello'){
    MP.friend=cleanName(d.name)||'Amico';MP.gone=false;mpSend({t:'welcome',host:OPT.name||'Tu'});
    if(G&&G.mp&&!G.over){MP.lastS=null;document.getElementById('modal').hidden=true;render()}else showMP();
    return;
  }
  if(!G||!G.mp||G.over)return;const seat=1;
  if(d.t==='act'){
    if(G.cur!==seat||G.await!=null||!G.players[seat].hand.includes(d.cid))return;
    playAction(seat,d.cid,d.m||null);G.await=seat;render();
  }else if(d.t==='sum'){
    if(G.await!==seat)return;G.await=null;
    if(d.s)doSummon(seat,d.s);else addLog('Nessun seguace da reclutare.','info',who(seat));
    endTurn();
  }else if(d.t==='pass'){
    if(G.cur!==seat||G.await!=null)return;doPass(seat);
  }
}
function mpApply(snap){
  const was=G&&G.mp&&G.gid===snap.gid&&G.over;
  const fresh=!(G&&G.gid===snap.gid&&G.mp);
  G=snap;G.started=true;turnSeq++;

  if(fresh){resetPop();mpLastEv=0;UI={phase:'idle'};const m=document.getElementById('modal');m.hidden=true;stopLeaves();setTimeout(centerMap,50)}
  (G.ev||[]).filter(e=>e.id>mpLastEv).forEach(e=>{announce(e.kind,e.head,e.html,e.ms,e.p);mpLastEv=e.id});
  if(G.over||G.cur!==ME)UI={phase:'idle'};
  else if(G.await===ME){if(UI.phase!=='summon'){UI={phase:'idle'};render();startSummon()}}

let leafRAF=0;
function stopLeaves(){cancelAnimationFrame(leafRAF);leafRAF=0}
function startLeaves(){
  stopLeaves();const cv=document.getElementById('leaves');if(!cv)return;
  let reduce=false;try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
  const ctx=cv.getContext('2d');let W=0,H=0,dpr=Math.min(2,window.devicePixelRatio||1);
  const size=()=>{W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};size();
  const N=Math.round(Math.min(18,Math.max(9,W/55)));
  const mk=first=>({x:Math.random()*W,y:first?Math.random()*H:-30-Math.random()*H*.4,s:9+Math.random()*9,vy:.25+Math.random()*.45,
    sw:12+Math.random()*26,ph:Math.random()*6.28,fq:.004+Math.random()*.006,a:Math.random()*6.28,va:(Math.random()-.5)*.02,
    flip:Math.random()*6.28,vf:.01+Math.random()*.02,hue:Math.random()});
  const L=Array.from({length:N},()=>mk(true));
  function leaf(p,t){
    const x=p.x+Math.sin(p.ph+t*p.fq)*p.sw,sc=Math.cos(p.flip);
    ctx.save();ctx.translate(x,p.y);ctx.rotate(p.a);ctx.scale(1,.45+.55*Math.abs(sc));
    const s=p.s,g=ctx.createLinearGradient(-s,0,s,0);
    g.addColorStop(0,p.hue>.5?'#2f7d2b':'#3b8f33');g.addColorStop(1,p.hue>.5?'#5fb84f':'#6cc25a');
    ctx.globalAlpha=.85;ctx.fillStyle=g;
    ctx.beginPath();ctx.moveTo(-s,0);ctx.bezierCurveTo(-s*.4,-s*.72,s*.55,-s*.62,s,0);ctx.bezierCurveTo(s*.55,s*.62,-s*.4,s*.72,-s,0);ctx.fill();
    ctx.strokeStyle='rgba(225,245,210,.7)';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(-s*1.12,0);ctx.lineTo(s*.85,0);ctx.stroke();
    ctx.lineWidth=.5;for(let k=-1;k<=1;k+=2)for(let j=0;j<3;j++){const bx=-s*.45+j*s*.42;ctx.beginPath();ctx.moveTo(bx,0);ctx.quadraticCurveTo(bx+s*.18,k*s*.2,bx+s*.32,k*s*.34);ctx.stroke()}
    ctx.restore();
  }
  let t=0;
  function frame(){
    if(!cv.isConnected||document.getElementById('modal').hidden){leafRAF=0;return}
    if(cv.clientWidth!==W||cv.clientHeight!==H)size();
    ctx.clearRect(0,0,W,H);t++;
    for(const p of L){p.y+=p.vy;p.a+=p.va;p.flip+=p.vf;if(p.y>H+30)Object.assign(p,mk(false));leaf(p,t)}
    leafRAF=requestAnimationFrame(frame);
  }
  if(reduce){ctx.clearRect(0,0,W,H);L.slice(0,7).forEach(p=>leaf(p,0));return}
  frame();
}

  mp.addEventListener('click',e=>{const g=e.target.closest('[data-r]');if(g)onRegion(+g.dataset.r)});
  mp.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const g=e.target.closest('[data-r]');if(g){e.preventDefault();onRegion(+g.dataset.r)}});
  mc.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const g=e.target.closest('[data-r]');if(g){e.preventDefault();onRegion(+g.dataset.r)}});
  document.getElementById('map').addEventListener('click',e=>{
    const g=e.target.closest('[data-r]');if(g){onRegion(+g.dataset.r);return}
    const svg=document.getElementById('map'),pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
    const q=pt.matrixTransform(svg.getScreenCTM().inverse());const z=hitZone(q.x,q.y);if(z>=0)onRegion(z)});
  document.getElementById('map').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const g=e.target.closest('[data-r]');if(g){e.preventDefault();onRegion(+g.dataset.r)}});
  document.getElementById('cal').addEventListener('click',e=>{const g=e.target.closest('button[data-r]');if(g)onRegion(+g.dataset.r)});
  document.getElementById('dock').addEventListener('click',e=>{
    const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
    if(a==='card')beginCard(+b.dataset.i);
    else if(a==='pass'){if(myTurn()&&UI.phase==='idle'){if(MPG()){mpSend({t:'pass'});UI={phase:'wait'};render()}else doPass(ME)}}
    else if(a==='cancel'){UI={phase:'idle'};render()}
    else if(a==='restart'){UI.moves=UI.all;UI.step=0;UI.picks={};advance();render()}
    else if(a==='opt'){pickVal(UI.opts[+b.dataset.i]);advance();render()}
    else if(a==='noeff'){const cid=UI.cid;UI={phase:'idle'};humanPlay(cid,null);render()}
    else if(a==='result')showEnd();
  });
  document.getElementById('modal').addEventListener('click',e=>{
    const ng=e.target.closest('[data-ngmode]');if(ng){NGMODE=ng.dataset.ngmode;showNewGame();return}
    const mpa=e.target.closest('[data-mpai]');if(mpa&&MP){MP.ai=mpa.dataset.mpai==='0'?0:mpa.dataset.mpai;updateSeg('mpai',mpa);const r=document.getElementById('mpDifRow');if(r)r.hidden=!MP.ai;return}
    const mpd=e.target.closest('[data-mpdif]');if(mpd&&MP){MP.dif=mpd.dataset.mpdif;updateSeg('mpdif',mpd);return}
    const ai=e.target.closest('[data-ai]');if(ai){OPT.ai=+ai.dataset.ai;saveOpt();updateSeg('ai',ai);syncOppRow();return}
    const op=e.target.closest('[data-opp]');if(op){OPT.opp=op.dataset.opp;saveOpt();updateSeg('opp',op);return}
    const df=e.target.closest('[data-dif]');if(df){OPT.dif=df.dataset.dif;saveOpt();updateSeg('dif',df);document.getElementById('difCap').textContent=DIFS.find(x=>x.id===OPT.dif).d;return}
    const mb=e.target.closest('[data-map]');if(mb){setMapMode(mb.dataset.map);updateSeg('map',mb);
      const mm=MAPMODES.find(x=>x.id===MAPMODE),img=document.querySelector('#modal .prev img');
      if(img){img.src=PREV[MAPMODE];img.alt='Anteprima della mappa '+mm.name.toLowerCase();img.height=MAPMODE==='reale'?287:714;document.querySelector('#modal .prev figcaption').textContent=mm.d}return}
    const tl=e.target.closest('.toc a');if(tl){e.preventDefault();document.getElementById(tl.getAttribute('href').slice(1))?.scrollIntoView({behavior:'smooth',block:'start'});return}
    const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
    if(a==='rules'){showRules();return}
    if(a==='play'){showNewGame();m0().scrollTop=0;return}
    if(a==='rclose'){closeRules();return}
    if(a==='mystats'){stConfirm=false;showStats();m0().scrollTop=0;return}
    if(a==='sclose'){stConfirm=false;showSetup();return}
    if(a==='st-reset'){stConfirm=true;const y=m0().scrollTop;showStats();m0().scrollTop=y;return}
    if(a==='st-reset-no'){stConfirm=false;const y=m0().scrollTop;showStats();m0().scrollTop=y;return}
    if(a==='st-reset-yes'){stConfirm=false;STATS=blankStats();saveStats();if(G)renderRec();showStats();m0().scrollTop=0;return}
    if(a==='code-copy'){const ta=document.getElementById('codeOut'),msg=document.getElementById('copyMsg');
      const fail=()=>{ta.focus();ta.select();msg.className='msg err';msg.textContent='Copia non disponibile qui: il codice è selezionato, copialo a mano.'};
      try{navigator.clipboard.writeText(ta.value).then(()=>{msg.className='msg ok';msg.textContent='Codice copiato. Ora incollalo dove vuoi conservarlo.'},fail)}catch(err){fail()}
      return}
    if(a==='code-share'){try{navigator.share({title:'Neo-Doge',text:'Neo-Doge, il mio codice di salvataggio: '+document.getElementById('codeOut').value}).catch(err=>{if(err&&err.name!=='AbortError'){const msg=document.getElementById('copyMsg');msg.className='msg err';msg.textContent='Condivisione non riuscita: usa Copia codice.'}})}catch(err){}return}
    if(a==='code-load'){const r=readCode(document.getElementById('codeIn').value),msg=document.getElementById('loadMsg');
      if(!r){msg.className='msg err';msg.textContent='Codice non valido: controlla di averlo copiato per intero, a partire da NDG1-.';return}
      STATS=r.s;saveStats();if(r.hasM){MEDS=r.m;saveMedals()}
      ['ai','opp','dif','name'].forEach(k=>{if(k in r.o)OPT[k]=r.o[k]});saveOpt();if(r.o.map)setMapMode(r.o.map);if(G)renderRec();
      const y=m0().scrollTop;showStats();m0().scrollTop=y;const m2=document.getElementById('loadMsg');m2.className='msg ok';m2.textContent='Fatto: statistiche, medaglie e opzioni ripristinate.';return}
    if(a==='mp-create'){NGMODE='amico';mpHost();return}
    if(a==='mp-join'){const inp=document.getElementById('mpcode');if(!mpJoin(inp&&inp.value,OPT.name)){const er=document.getElementById('mpErr');if(er)er.textContent='Codice non valido: sono 5 tra lettere e numeri.'}return}
    if(a==='mp-join-invite'){const code=b.dataset.code;try{history.replaceState(null,'',location.pathname)}catch(err){}if(!mpJoin(code,OPT.name))showNewGame();return}
    if(a==='mp-retry'){if(MP&&MP.role==='guest'){const c=MP.code,n=MP.name||OPT.name;mpJoin(c,n)}return}
    if(a==='mp-start'){mpStart();return}
    if(a==='mp-rematch'){mpStart();return}
    if(a==='mp-leave'){mpClose();NGMODE='amico';showNewGame();return}
    if(a==='mp-exit'){mpClose();newGame(OPT.ai);render();showSetup();return}
    if(a==='mp-copy'){const inp=document.getElementById('mpLink'),msg=document.getElementById('mpMsg');
      const fail=()=>{inp.focus();inp.select();msg.className='msg err';msg.textContent='Copia non disponibile qui: il link è selezionato, copialo a mano.'};
      try{navigator.clipboard.writeText(inp.value).then(()=>{msg.className='msg ok';msg.textContent='Link copiato. Mandalo al tuo amico.'},fail)}catch(err){fail()}return}
    if(a==='mp-share'){try{navigator.share({title:'Neo-Doge',text:'Giochiamo a Neo-Doge! Entra nella mia stanza:',url:mpLink()}).catch(()=>{})}catch(err){}return}
    if(a==='start'){document.getElementById('modal').hidden=true;newGame(OPT.ai);G.started=true;render();centerMap();schedule()}
    else if(a==='close')document.getElementById('modal').hidden=true;
    else if(a==='setup')showSetup();
  });
  document.getElementById('menuBtn').addEventListener('click',()=>{resetArmed=false;showSetup()});
  document.getElementById('modal').addEventListener('input',e=>{if(e.target.id==='pname'){OPT.name=cleanName(e.target.value);saveOpt()}});
  document.getElementById('pop').addEventListener('click',nextPop);
  document.getElementById('rulesBtn').addEventListener('click',showRules);
  document.getElementById('rulesBtn2').addEventListener('click',showRules);
  document.addEventListener('keydown',e=>{if(e.key!=='Escape'||document.getElementById('modal').hidden)return;
    if(document.querySelector('#modal [data-act=sclose]')){stConfirm=false;showSetup()}
    else if(document.getElementById('rulesT')&&document.querySelector('#modal .dlg.wide'))closeRules();else if(G&&G.started)document.getElementById('modal').hidden=true});
  let rzT=null;window.addEventListener('resize',()=>{sizeDock();clearTimeout(rzT);rzT=setTimeout(()=>{if(G)render()},150)});
  try{window.claude?.hot?.snapshot?.(()=>({G}))}catch(e){}
  const start=d=>{
    let g=d&&d.G;
    if(!g){try{g=JSON.parse(localStorage.getItem('neodoge.v1')||'null')}catch(e){g=null}}
    if(g&&g.B&&!g.over){G=g;G.started=true;UI={phase:'idle'};render();schedule()}
    else{newGame(OPT.ai);render();showSetup()}
    centerMap();
    try{const q=new URLSearchParams(location.search).get('stanza');if(q&&/^[A-Za-z0-9-]{4,14}$/.test(q))showInvite(q.toUpperCase().replace('NEODOGE-',''))}catch(e){}
  };
  try{window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{})}catch(e){start({})}
}
</script>
